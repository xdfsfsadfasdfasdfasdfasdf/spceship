<!DOCTYPE html>

<html>
    <head>
        <link rel="icon" href="https://raw.githubusercontent.com/ABCxFF/diepcustom/main/icon.png"/>
        <title>diep.io custom-server</title>
        
        <style>
          body {
            background-color: #0d0714;
            font-family: 'Press Start 2P', cursive, monospace;
          }

          #canvas {
            border: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0d0714;
          }
    
          #loading {
            color: #B026FF;
            text-shadow: 0 0 15px #B026FF, 0 0 30px #00F0FF;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24pt;
            font-family: 'Press Start 2P', cursive, monospace;
            font-weight: bold;
            cursor: default;
            letter-spacing: 2px;
          }
    
          #canvas {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            cursor: default;
          }
    
          #textInputContainer {
            display: none;
            position: absolute;
            z-index: 100;
            pointer-events: auto;
          }
    
          #textInput {
            background-color: #12091f;
            font-family: 'Press Start 2P', cursive, monospace;
            color: #ffffff;
            padding: 0 8px;
            border: 2px solid #a855f7;
            border-radius: 6px;
            outline: none;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            text-align: center;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
          }
          #textInput:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
          }

          /* Settings Button */
          #settingsBtn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(20, 10, 35, 0.85);
            border: 2px solid #a855f7;
            color: #e9d5ff;
            font-size: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transition: all 0.2s ease;
          }
          #settingsBtn:hover {
            background: #a855f7;
            color: #fff;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
            transform: scale(1.1);
          }

          /* Settings Overlay & Modal */
          #settingsOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 5, 20, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
          }
          #settingsModal {
            background: #140b24;
            border: 2px solid #a855f7;
            border-radius: 14px;
            padding: 24px;
            width: 440px;
            max-width: 90vw;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.5);
            font-family: 'Press Start 2P', monospace;
            color: #fff;
          }
          .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #c084fc;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
            padding-bottom: 14px;
            margin-bottom: 20px;
          }
          #closeSettingsBtn {
            background: transparent;
            border: none;
            color: #f43f5e;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
          }
          #closeSettingsBtn:hover {
            color: #ff4d4d;
            transform: scale(1.2);
          }
          .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          }
          .setting-label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 280px;
          }
          .setting-title {
            font-size: 11px;
            color: #e9d5ff;
          }
          .setting-desc {
            font-size: 8px;
            color: #94a3b8;
            line-height: 1.4;
          }
          .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
          }
          .switch input { opacity: 0; width: 0; height: 0; }
          .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 24px;
            border: 1px solid #64748b;
          }
          .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
          }
          input:checked + .slider { background-color: #a855f7; border-color: #c084fc; }
          input:checked + .slider:before { transform: translateX(20px); }

          .slider-control-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            min-width: 140px;
          }

          .slider-value-label {
            font-size: 8px;
            color: #38bdf8;
            font-family: 'Press Start 2P', monospace;
          }

          .custom-range-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 130px;
            height: 6px;
            background: #1e1135;
            border: 1px solid #a855f7;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
          }

          .custom-range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #c084fc;
            border: 2px solid #fff;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
          }

          .custom-range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #38bdf8;
          }

          .custom-range-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #c084fc;
            border: 2px solid #fff;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
          }

          .custom-range-slider::-moz-range-thumb:hover {
            transform: scale(1.2);
            background: #38bdf8;
          }

          /* Chat Widget (Centered Right) */
          #chatContainer {
            position: fixed;
            top: 45%;
            transform: translateY(-50%);
            right: 20px;
            left: auto;
            bottom: auto;
            width: 310px;
            background: rgba(15, 10, 22, 0.75);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 999;
            pointer-events: auto;
            display: none;
            flex-direction: column;
            box-sizing: border-box;
          }
          #chatFeed {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 160px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #a855f7 transparent;
          }
          .chat-msg {
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            line-height: 1.4;
            word-wrap: break-word;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
          }
          .chat-sender {
            color: #c084fc;
            font-family: 'Press Start 2P', monospace;
            margin-right: 4px;
            font-weight: bold;
          }
          #chatForm {
            margin-top: 8px;
            width: 100%;
          }
          #chatInput {
            width: 100%;
            box-sizing: border-box;
            background: rgba(10, 6, 18, 0.85);
            border: 2px solid #a855f7;
            border-radius: 6px;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 8px 10px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
          }
          #chatInput:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
          }
          #chatInput::placeholder {
            color: #94a3b8;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
          }

          /* Below-Player In-Game Speech Bubbles */
          #playerChatContainer {
            position: fixed;
            top: calc(50% + 45px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            pointer-events: none;
            z-index: 998;
            width: max-content;
            max-width: 280px;
          }
          .player-bubble {
            background: rgba(18, 12, 26, 0.88);
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 6px 10px;
            border-radius: 5px;
            text-align: center;
            word-break: break-word;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            animation: popIn 0.15s ease-out;
          }
          @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
          }
        </style>

        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Ubuntu:700" rel="stylesheet" type="text/css" />
    </head>

    <body>
        <!-- Settings Button -->
        <button id="settingsBtn" title="Settings">⚙</button>

        <!-- Settings Modal -->
        <div id="settingsOverlay">
          <div id="settingsModal">
            <div class="settings-header">
              <span>⚙ SETTINGS</span>
              <button id="closeSettingsBtn">✖</button>
            </div>
            
            <div class="setting-item">
              <div class="setting-label">
                <span class="setting-title">Toggle class tree</span>
                <span class="setting-desc">Press Y to toggle upgrade tree preview</span>
              </div>
              <label class="switch">
                <input type="checkbox" id="settingToggleClassTree">
                <span class="slider"></span>
              </label>
            </div>

            <div class="setting-item">
              <div class="setting-label">
                <span class="setting-title">Auto Level Up</span>
                <span class="setting-desc">Spawn as level 45 automatically</span>
              </div>
              <label class="switch">
                <input type="checkbox" id="settingAutoLevelUp" checked>
                <span class="slider"></span>
              </label>
            </div>

            <div class="setting-item">
              <div class="setting-label">
                <span class="setting-title">Censoring</span>
                <span class="setting-desc">Profanity filter for chat messages</span>
              </div>
              <div class="slider-control-container">
                <span id="settingCensoringLabel" class="slider-value-label">No censoring</span>
                <input type="range" id="settingCensoringSlider" min="0" max="3" step="1" value="0" class="custom-range-slider">
              </div>
            </div>
          </div>
        </div>

        <!-- Below-Player Speech Bubbles (Max 3, 5s timeout) -->
        <div id="playerChatContainer"></div>

        <!-- Chat Widget (Above Minimap) -->
        <div id="chatContainer">
          <div id="chatFeed"></div>
          <form id="chatForm" onsubmit="return false;">
            <input type="text" id="chatInput" placeholder="Press Enter to chat..." maxlength="100" autocomplete="off" />
          </form>
        </div>

        <span id="loading">Loading...</span>
        <canvas id="canvas" tabindex="0" width="800" height="800"></canvas>
        <div style="font-family:'Press Start 2P'">&nbsp;</div>
        <div id="textInputContainer"><input id="textInput"></div>
        
        <!-- Third party library for dynmically modifying wasm files on the fly-->
        <script src ="https://cdn.jsdelivr.net/gh/Qwokka/wail.min.js@5e32d36bd7a5e0830d1ff4b64d3587aea13f77da/wail.min.js" crossorigin="anonymous"></script>

        <script src="./config.js"></script>
        <script src="./input.js"></script>
        <script src="./dma.js"></script>
        <script src="./loader.js"></script>
    </body>
</html>
